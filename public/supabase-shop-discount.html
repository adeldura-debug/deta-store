<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA — المتجر</title><link rel="stylesheet" href="formal.css"><style>.sale{color:#9b3e3e;font-size:13px}.old{text-decoration:line-through;color:#89929a;margin-left:8px}.discount-badge{background:#17212b;color:#d5bc83;padding:5px 8px;font-size:11px;display:inline-block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1200px;margin:auto;padding:70px 5%}.card{background:#fff;border:1px solid #e4e6e8;padding-bottom:20px}.card .ph{height:300px;background:#e2e5e5;display:grid;place-items:center;font-size:50px}.card-info{padding:18px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.card .ph{height:210px}}</style></head><body><header><a class="logo" href="home-final.html">DETA<span>®</span></a><nav><a href="home-final.html">الرئيسية</a><a href="#products">المتجر</a><a href="supabase-shop.html#print">اطبع فكرتك</a></nav></header><main><section style="max-width:1200px;margin:auto;padding:70px 5% 0"><p class="tag">DETA SALE</p><h1>المجموعة<br><em>الحالية.</em></h1><p id="status">جاري تحميل المنتجات...</p></section><section id="products" class="cards"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(DETA_SUPABASE_URL,DETA_SUPABASE_ANON_KEY),root=document.querySelector('#products'),statusEl=document.querySelector('#status');function price(p,d){if(!d)return {now:+p.price,old:null};const n=d.type==='percentage'?p.price-(p.price*d.value/100):p.price-d.value;return {now:Math.max(0,n),old:p.price}}async function go(){const now=new Date().toISOString(),[ps,ds]=await Promise.all([db.from('products').select('*').eq('status','published'),db.from('discounts').select('*').eq('active',true).lte('start_date',now).gte('end_date',now).order('value',{ascending:false}).limit(1)]);const d=ds.data?.[0];statusEl.textContent=d?`خصم ${d.type==='percentage'?d.value+'%':d.value+'$'} لفترة محدودة`:'المجموعة الحالية';root.innerHTML=(ps.data||[]).map(p=>{const q=price(p,d);return `<article class="card"><div class="ph">${p.name_ar}</div><div class="card-info">${d?`<span class="discount-badge">خصم ${d.type==='percentage'?d.value+'%':d.value+'$'}</span>`:''}<h3>${p.name_ar}</h3><p>${p.description_ar||''}</p><strong>${q.old?`<span class="old">${q.old.toFixed(2)} $</span>`:''}${q.now.toFixed(2)} $</strong><br><button class="btn" onclick="alert('سيتم ربط الطلب المباشر بالسعر المخفض في الخطوة التالية')">اطلب الآن ↗</button></div></article>`}).join('')||'<p>لا توجد منتجات منشورة.</p>'}go();</script></body></html>
