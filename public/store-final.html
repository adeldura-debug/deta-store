<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Store</title><link rel="stylesheet" href="formal.css"><style>.wrap{max-width:1200px;margin:auto;padding:70px 5%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid #e1e5e8}.pic{height:300px;background:#e3e6e7;display:grid;place-items:center;font-size:42px}.info{padding:18px}.old{text-decoration:line-through;color:#89929a;margin-left:8px}.sale{color:#9b3e3e}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:9}.modal[hidden]{display:none!important}.modal form{background:#fff;width:min(520px,100%);padding:28px;display:grid;gap:13px;position:relative}.modal input,.modal select{padding:12px;border:1px solid #ccd3d8;font:inherit}.close{position:absolute;left:12px;top:8px;border:0;background:none;font-size:25px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.pic{height:210px}}</style></head><body><header><a class="logo" href="home-final.html">DETA<span>®</span></a><nav><a href="home-final.html">الرئيسية</a><a href="#products">المتجر</a><a href="#print">اطبع فكرتك</a></nav><span>طلب مباشر</span></header><main class="wrap"><p class="tag">DETA COLLECTION</p><h1>اختَر قطعتك<br><em>واطلبها مباشرة.</em></h1><p id="status">جاري التحميل...</p><section id="products" class="grid"></section></main><div id="orderModal" class="modal" hidden><form id="orderForm"><button type="button" class="close">×</button><h2>إتمام الطلب</h2><input type="hidden" name="product"><input name="name" placeholder="الاسم" required><input name="phone" placeholder="رقم الهاتف" required><input name="address" placeholder="العنوان" required><select name="size"><option>S</option><option>M</option><option>L</option><option>XL</option></select><input name="color" placeholder="اللون" required><input name="quantity" type="number" min="1" value="1"><button class="btn">تأكيد الطلب</button><p id="message"></p></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const dbf=supabase.createClient(DETA_SUPABASE_URL,DETA_SUPABASE_ANON_KEY),root=document.querySelector('#products'),modal=document.querySelector('#orderModal'),form=document.querySelector('#orderForm');let products=[],discount=null;const safe=x=>String(x??'').replace(/[&<>]/g,'');function calc(p){if(!discount)return{now:+p.price,old:null};const n=discount.type==='percentage'?p.price-p.price*discount.value/100:p.price-discount.value;return{now:Math.max(0,n),old:+p.price}}async function load(){const now=new Date().toISOString();const [p,d]=await Promise.all([dbf.from('products').select('*').eq('status','published').order('created_at',{ascending:false}),dbf.from('discounts').select('*').eq('active',true).lte('start_date',now).gte('end_date',now).order('value',{ascending:false}).limit(1)]);products=p.data||[];discount=d.data?.[0]||null;root.innerHTML=products.map(x=>{const q=calc(x);return `<article class="card"><div class="pic">${x.images?.[0]?`<img src="${x.images[0]}" style="width:100%;height:100%;object-fit:cover">`:'DETA'}</div><div class="info"><h3>${safe(x.name_ar)}</h3><p>${safe(x.description_ar)}</p><strong>${q.old?`<span class="old">${q.old.toFixed(2)} $</span>`:''}${q.now.toFixed(2)} $</strong>${discount?`<span class="sale"> · خصم ${discount.type==='percentage'?discount.value+'%':discount.value+'$'}</span>`:''}<br><button class="btn order" data-id="${x.id}">اطلب الآن ↗</button></div></article>`}).join('')||'<p>لا توجد منتجات منشورة.</p>';document.querySelectorAll('.order').forEach(b=>b.onclick=()=>{modal.hidden=false;form.product.value=b.dataset.id})}form.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form)),p=products.find(x=>x.id===f.product),q=calc(p),total=q.now*+f.quantity,row={customer_name:f.name,customer_phone:f.phone,customer_address:f.address,items:[{product:p.id,name:p.name_ar,size:f.size,color:f.color,quantity:+f.quantity,price:q.now,discount:q.old?+(q.old-q.now).toFixed(2):0}],total,discount:q.old?+(q.old-q.now).toFixed(2)*+f.quantity:0,status:'new'};const r=await dbf.from('orders').insert(row);if(r.error){message.textContent=r.error.message;return}const text=encodeURIComponent(`طلب DETA%0Aالاسم: ${f.name}%0Aالهاتف: ${f.phone}%0Aالمنتج: ${p.name_ar}%0Aالمقاس: ${f.size}%0Aاللون: ${f.color}%0Aالكمية: ${f.quantity}%0Aالإجمالي: ${total.toFixed(2)}$`);message.innerHTML=`تم إنشاء الطلب بنجاح. <a href="https://wa.me/${DETA_WHATSAPP_NUMBER}?text=${text}" target="_blank">إرسال ملخص عبر WhatsApp</a>`;form.reset()};document.querySelector('.close').onclick=()=>modal.hidden=true;load();</script></body></html>
