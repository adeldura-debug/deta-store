<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Admin</title><link rel="stylesheet" href="formal.css"><style>.admin{max-width:1200px;margin:auto;padding:45px 5%}.admin header{margin:-45px -6% 40px;width:112%;padding:0 5%}.panel{background:#fff;border:1px solid #e1e5e8;padding:25px;margin:22px 0}.panel h2{font-size:28px;margin:0 0 20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form-grid input,.form-grid textarea,.form-grid select{padding:12px;border:1px solid #ccd3d8;font:inherit;background:#fff}.form-grid textarea{min-height:90px}.full{grid-column:1/-1}.table-row{border-top:1px solid #e1e5e8;padding:14px 0;display:flex;justify-content:space-between;gap:20px}.danger{color:#9b3e3e}.status{color:#687b33}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.admin header{width:122%}}</style></head><body><div class="admin"><header><a class="logo" href="supabase-preview.html">DETA<span>®</span></a><button id="logout">خروج</button></header><section id="login" class="panel"><h2>دخول لوحة الإدارة</h2><form id="loginForm" class="form-grid"><input name="email" type="email" placeholder="البريد الإلكتروني" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="btn full">دخول</button></form><p id="loginMessage"></p></section><div id="app" hidden><section class="panel"><h2>إضافة منتج</h2><form id="productForm" class="form-grid"><input required name="name_ar" placeholder="اسم المنتج بالعربي"><input required name="name_en" placeholder="Product name"><textarea class="full" name="description_ar" placeholder="الوصف بالعربي"></textarea><textarea class="full" name="description_en" placeholder="Description in English"></textarea><input required name="price" type="number" step="0.01" placeholder="السعر"><input name="old_price" type="number" step="0.01" placeholder="السعر القديم"><input required name="stock" type="number" placeholder="المخزون"><input name="category" placeholder="الفئة"><input name="sizes" placeholder="S, M, L"><input name="colors" placeholder="Black, White"><select name="status"><option value="published">منشور</option><option value="draft">مسودة</option></select><button class="btn full">حفظ المنتج</button></form><p id="productMessage"></p></section><section class="panel"><h2>المنتجات</h2><div id="products">جاري التحميل...</div></section><section class="panel"><h2>الطلبات</h2><div id="orders">جاري التحميل...</div></section><section class="panel"><h2>طلبات الطباعة</h2><div id="prints">جاري التحميل...</div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-admin.js"></script></body></html>
