<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Admin</title><link rel="stylesheet" href="formal.css"><style>main{max-width:1100px;margin:auto;padding:40px 5%}.box{background:#fff;padding:25px;margin:20px 0}.row{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding:14px 0;gap:15px}.row a{color:#8a6a32}.row select{padding:6px}</style></head><body><main><header><a class="logo" href="home-final.html">DETA<span>®</span></a><button id="out">خروج</button></header><section id="login" class="box"><h1>لوحة الإدارة</h1><form id="lf"><input name="email" type="email" placeholder="البريد" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="btn">دخول</button></form><p id="lm"></p></section><section id="app" hidden><div class="box"><a class="btn" href="supabase-admin-simple.html">إضافة منتج</a> <a class="btn" href="brand-admin.html">البراند</a> <a class="btn" href="discount-admin-fixed.html">الخصومات</a></div><div class="box"><h2>المنتجات</h2><div id="p"></div></div><div class="box"><h2>الطلبات</h2><div id="o"></div></div><div class="box"><h2>طلبات الطباعة</h2><div id="c"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const a=supabase.createClient(DETA_SUPABASE_URL,DETA_SUPABASE_ANON_KEY),q=s=>document.querySelector(s);async function load(){const [p,o,c]=await Promise.all([a.from('products').select('*').order('created_at',{ascending:false}),a.from('orders').select('*').order('created_at',{ascending:false}),a.from('custom_print_orders').select('*').order('created_at',{ascending:false})]);q('#p').innerHTML=(p.data||[]).map(x=>`<div class="row"><span>${x.name_ar} · ${x.price}$ · ${x.stock} مخزون</span><span><a href="product-edit.html?id=${x.id}">تعديل</a> <button onclick="del('${x.id}')">حذف</button></span></div>`).join('')||'لا توجد منتجات';q('#o').innerHTML=(o.data||[]).map(x=>`<div class="row"><span>${x.customer_name} · ${x.total}$</span><select onchange="st('${x.id}',this.value)"><option>${x.status}</option><option>new</option><option>processing</option><option>shipped</option><option>completed</option><option>cancelled</option></select></div>`).join('')||'لا توجد طلبات';q('#c').innerHTML=(c.data||[]).map(x=>`<div class="row">${x.customer_name} · ${x.garment_type} · ${x.quantity}</div>`).join('')||'لا توجد طلبات طباعة'}window.del=async id=>{if(confirm('حذف المنتج؟')){await a.from('products').delete().eq('id',id);load()}};window.st=async(id,status)=>a.from('orders').update({status}).eq('id',id);q('#lf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),r=await a.auth.signInWithPassword({email:f.email,password:f.password});if(r.error)q('#lm').textContent=r.error.message;else{q('#login').hidden=true;q('#app').hidden=false;load()}};q('#out').onclick=async()=>{await a.auth.signOut();location.reload()};a.auth.getSession().then(({data})=>{if(data.session){q('#login').hidden=true;q('#app').hidden=false;load()}})</script></body></html>
