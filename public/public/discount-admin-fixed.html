<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA — الخصومات</title><link rel="stylesheet" href="formal.css"><style>main{max-width:800px;margin:55px auto;padding:30px;background:#fff}.form{display:grid;gap:15px}.form input,.form select{padding:13px;border:1px solid #ccd3d8;font:inherit}.discount{border-top:1px solid #ddd;padding:15px 0;display:flex;justify-content:space-between}.msg{color:#687b33}</style></head><body><main><a class="logo" href="supabase-admin-simple.html">DETA<span>®</span></a><h1>خصومات مؤقتة</h1><p>التاريخ حسب توقيت جهازك، ويتم تحويله تلقائيًا بشكل صحيح.</p><form id="form" class="form"><input name="name" placeholder="اسم الخصم" required><select name="type"><option value="percentage">نسبة مئوية</option><option value="fixed">مبلغ ثابت</option></select><input name="value" type="number" min="0" placeholder="قيمة الخصم" required><label>يبدأ الخصم<br><input name="start_date" type="datetime-local" required></label><label>ينتهي الخصم<br><input name="end_date" type="datetime-local" required></label><button class="btn">حفظ الخصم</button><p id="msg" class="msg"></p></form><h2>الخصومات الحالية</h2><div id="list">جاري التحميل...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const dbd=supabase.createClient(DETA_SUPABASE_URL,DETA_SUPABASE_ANON_KEY),f=document.querySelector('#form'),msg=document.querySelector('#msg');const iso=v=>new Date(v).toISOString();async function load(){const r=await dbd.from('discounts').select('*').order('start_date',{ascending:false});document.querySelector('#list').innerHTML=(r.data||[]).map(x=>`<div class="discount"><span><b>${x.name}</b><br>${x.value}${x.type==='percentage'?'%':'$'}<br><small>${new Date(x.start_date).toLocaleString('ar-SY')} — ${new Date(x.end_date).toLocaleString('ar-SY')}</small></span><button onclick="del('${x.id}')">حذف</button></div>`).join('')||'لا توجد خصومات'}f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),start=new Date(d.start_date),end=new Date(d.end_date);if(end<=start){msg.textContent='تاريخ النهاية يجب أن يكون بعد تاريخ البداية';return}if(+d.value<=0){msg.textContent='أدخل قيمة خصم أكبر من صفر';return}const r=await dbd.from('discounts').insert({name:d.name,type:d.type,value:+d.value,start_date:iso(d.start_date),end_date:iso(d.end_date),active:true});msg.textContent=r.error?.message||'تم حفظ الخصم بالتاريخ الصحيح';if(!r.error){f.reset();load()}};window.del=async id=>{await dbd.from('discounts').delete().eq('id',id);load()};load();</script></body></html>
