<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Admin</title><link rel="stylesheet" href="formal.css"><style>.admin{max-width:1100px;margin:auto;padding:45px 5%}.admin header{margin:-45px -6% 40px;width:112%;padding:0 5%}.panel{background:#fff;border:1px solid #e1e5e8;padding:25px;margin:22px 0}.panel h2{font-size:28px;margin:0 0 20px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form input,.form textarea,.form select{padding:12px;border:1px solid #ccd3d8;font:inherit;background:#fff}.form textarea{min-height:110px}.full{grid-column:1/-1}.preview{width:130px;height:130px;object-fit:cover;margin-top:10px;display:none}@media(max-width:700px){.form{grid-template-columns:1fr}}</style></head><body><div class="admin"><header><a class="logo" href="supabase-preview.html">DETA<span>®</span></a><button id="logout">خروج</button></header><section id="login" class="panel"><h2>دخول لوحة الإدارة</h2><form id="loginForm" class="form"><input name="email" type="email" placeholder="البريد الإلكتروني" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="btn full">دخول</button></form><p id="loginMsg"></p></section><div id="app" hidden><section class="panel"><h2>إضافة منتج</h2><form id="productForm" class="form"><input class="full" name="name" placeholder="اسم المنتج" required><textarea class="full" name="description" placeholder="وصف المنتج"></textarea><input name="price" type="number" step="0.01" placeholder="السعر" required><input name="old_price" type="number" step="0.01" placeholder="السعر القديم"><input name="stock" type="number" placeholder="المخزون" required><input name="category" placeholder="الفئة"><input name="sizes" placeholder="المقاسات: S, M, L"><input name="colors" placeholder="الألوان: Black, White"><select name="status"><option value="published">منشور</option><option value="draft">مسودة</option></select><label class="full">صورة المنتج<input id="image" type="file" accept="image/png,image/jpeg,image/webp" required><img id="preview" class="preview"></label><button class="btn full">رفع وحفظ المنتج</button></form><p id="msg"></p></section><section class="panel"><h2>المنتجات</h2><div id="products">جاري التحميل...</div></section><section class="panel"><h2>الطلبات</h2><div id="orders">جاري التحميل...</div></section><section class="panel"><h2>طلبات الطباعة</h2><div id="prints">جاري التحميل...</div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-admin-simple.js"></script></body></html>
