<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Discounts</title><link rel="stylesheet" href="formal.css"><style>main{max-width:800px;margin:60px auto;padding:30px;background:#fff}.form{display:grid;gap:15px}.form input,.form select{padding:13px;border:1px solid #ccd3d8;font:inherit}.discount{border-top:1px solid #ddd;padding:15px 0;display:flex;justify-content:space-between}</style></head><body><main><a class="logo" href="supabase-admin-simple.html">DETA<span>®</span></a><h1>خصومات مؤقتة</h1><form id="form" class="form"><input name="name" placeholder="اسم الخصم" required><select name="type"><option value="percentage">نسبة مئوية</option><option value="fixed">مبلغ ثابت</option></select><input name="value" type="number" min="0" placeholder="قيمة الخصم" required><label>يبدأ الخصم <input name="start_date" type="datetime-local" required></label><label>ينتهي الخصم <input name="end_date" type="datetime-local" required></label><button class="btn">حفظ الخصم</button><p id="msg"></p></form><h2>الخصومات الحالية</h2><div id="list">جاري التحميل...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const dbase=supabase.createClient(DETA_SUPABASE_URL,DETA_SUPABASE_ANON_KEY),form=document.querySelector('#form'),list=document.querySelector('#list');async function load(){const r=await dbase.from('discounts').select('*').order('start_date',{ascending:false});list.innerHTML=(r.data||[]).map(x=>`<div class="discount"><span>${x.name} · ${x.value}${x.type==='percentage'?'%':'$'}<br><small>${new Date(x.start_date).toLocaleString()} — ${new Date(x.end_date).toLocaleString()}</small></span><button onclick="removeD('${x.id}')">حذف</button></div>`).join('')||'لا توجد خصومات'}form.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form)),r=await dbase.from('discounts').insert({name:f.name,type:f.type,value:+f.value,start_date:new Date(f.start_date).toISOString(),end_date:new Date(f.end_date).toISOString(),active:true});document.querySelector('#msg').textContent=r.error?.message||'تم حفظ الخصم';if(!r.error){form.reset();load()}};window.removeD=async id=>{await dbase.from('discounts').delete().eq('id',id);load()};load();</script></body></html>
