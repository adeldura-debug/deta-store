<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Promo</title><link rel="stylesheet" href="formal.css"><style>main{max-width:650px;margin:70px auto;padding:30px;background:#fff}form{display:grid;gap:15px}input{padding:14px;border:1px solid #ccd3d8;font:inherit}label{display:flex;gap:10px;align-items:center}.msg{color:#687b33}</style></head><body><main><a class="logo" href="supabase-admin-simple.html">DETA<span>®</span></a><h1>إعداد عرض التخفيض</h1><form id="f"><label><input name="active" type="checkbox"> عرض التخفيض على الصفحة الرئيسية</label><input name="text" placeholder="نص العرض بالعربي" value="خصم خاص لفترة محدودة"><input name="percent" type="number" min="0" max="100" placeholder="نسبة الخصم"><button class="btn">حفظ العرض</button><p class="msg" id="m"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const x=supabase.createClient(DETA_SUPABASE_URL,DETA_SUPABASE_ANON_KEY),f=document.querySelector('#f');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const r=await x.from('brand_settings').update({promo_active:f.active.checked,promo_text_ar:d.text,promo_percent:+d.percent||0}).eq('id',true);document.querySelector('#m').textContent=r.error?.message||'تم حفظ العرض بنجاح'};</script></body></html>
