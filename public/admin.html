<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Admin</title><link rel="stylesheet" href="/store.css"><style>body{padding:30px}.admin{max-width:1100px;margin:auto}.panel{background:#fff;padding:25px;margin:20px 0;border:1px solid #ddd}.panel h2{font-size:28px;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}input,select,textarea{padding:12px;border:1px solid #bbb;background:transparent;font:inherit;width:100%}.row{display:flex;gap:10px;align-items:center;border-top:1px solid #ddd;padding:14px 0}.row img{width:60px;height:60px;object-fit:cover;background:#ddd}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="admin"><header><a class="logo" href="/">DETA<span>®</span></a><button id="logout">تسجيل الخروج</button></header><section id="login" class="panel"><h2>دخول لوحة التحكم</h2><form id="loginForm" class="grid"><input name="email" type="email" placeholder="البريد الإلكتروني" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="btn">دخول</button></form><p id="loginStatus"></p></section><div id="dashboard" class="hidden"><section class="panel"><h2>إضافة منتج</h2><form id="productForm" class="grid"><input name="nameAr" placeholder="اسم المنتج بالعربي" required><input name="nameEn" placeholder="Product name in English" required><input name="price" type="number" placeholder="السعر" required><input name="oldPrice" type="number" placeholder="السعر القديم"><input name="stock" type="number" placeholder="المخزون" required><input name="category" placeholder="الفئة"><input name="sizes" placeholder="المقاسات: S,M,L"><input name="colors" placeholder="الألوان: Black,White"><select name="status"><option value="published">منشور</option><option value="draft">مسودة</option></select><textarea name="descriptionAr" placeholder="الوصف بالعربي"></textarea><textarea name="descriptionEn" placeholder="Description in English"></textarea><button class="btn">حفظ المنتج</button></form><p id="productStatus"></p></section><section class="panel"><h2>المنتجات</h2><div id="productList">جاري التحميل...</div></section><section class="panel"><h2>طلبات الطباعة المخصصة</h2><div id="printList">جاري التحميل...</div></section><section class="panel"><h2>الطلبات</h2><div id="orderList">جاري التحميل...</div></section></div></div><script src="/admin.js"></script></body></html>
