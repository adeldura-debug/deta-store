<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETA Brand Settings</title><link rel="stylesheet" href="formal.css"><style>main{max-width:850px;margin:55px auto;padding:30px;background:#fff}.form{display:grid;gap:15px}.form input,.form textarea{padding:14px;border:1px solid #ccd3d8;font:inherit}.form textarea{min-height:110px}.msg{color:#687b33}</style></head><body><main><a class="logo" href="supabase-admin-simple.html">DETA<span>®</span></a><h1>إعدادات البراند</h1><form id="brandForm" class="form"><input name="hero_title_ar" placeholder="عنوان المقدمة الرئيسية" required><textarea name="hero_text_ar" placeholder="نص المقدمة الرئيسية"></textarea><input name="intro_title_ar" placeholder="عنوان نبذة DETA" required><textarea name="intro_text_ar" placeholder="نبذة عن DETA"></textarea><input name="hero_image" placeholder="رابط صورة المقدمة (اختياري)"><button class="btn">حفظ التعديلات</button><p id="msg" class="msg"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const bsb=supabase.createClient(DETA_SUPABASE_URL,DETA_SUPABASE_ANON_KEY),f=document.querySelector('#brandForm');async function load(){const r=await bsb.from('brand_settings').select('*').single();if(r.data)for(const k of ['hero_title_ar','hero_text_ar','intro_title_ar','intro_text_ar','hero_image'])if(f[k])f[k].value=r.data[k]||''}f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),r=await bsb.from('brand_settings').update(d).eq('id',true);document.querySelector('#msg').textContent=r.error?.message||'تم تحديث البراند بنجاح'};load();</script></body></html>
